<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>濟州首爾自駕隨行 Pocket Guide</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Noto Sans TC & Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- PWA Meta & Web App Manifest (Data URL for single-file deployment) -->
  <meta name="theme-color" content="#6E836A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="濟州首爾隨行">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/6E836A/ffffff?text=Jeju+Guide">
  <link rel="manifest" id="manifest-placeholder">

  <script>
    // 動態生成 Web App Manifest (維持單一文件檔名與完整性)
    (function registerDynamicManifest() {
      const manifestData = {
        name: "濟州首爾自駕隨行 Pocket Guide",
        short_name: "濟州首爾隨行",
        description: "2026 濟州 · 首爾自駕遊隨行離線手冊",
        start_url: "./",
        display: "standalone",
        background_color: "#FBF9F5",
        theme_color: "#6E836A",
        icons: [
          {
            src: "https://placehold.co/192x192/6E836A/ffffff?text=Jeju+Guide",
            sizes: "192x192",
            type: "image/png"
          },
          {
            src: "https://placehold.co/512x512/6E836A/ffffff?text=Jeju+Guide",
            sizes: "512x512",
            type: "image/png"
          }
        ]
      };
      const stringManifest = JSON.stringify(manifestData);
      const blob = new Blob([stringManifest], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(blob);
      document.getElementById('manifest-placeholder').setAttribute('href', manifestUrl);
    })();
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linen: '#FBF9F5',
            sand: '#F3EEE7',
            washi: '#FAF6EE',
            charcoal: '#2D312E',
            mutedgray: '#787E7A',
            matcha: '#6E836A',
            matchalight: '#EAF0E9',
            terracotta: '#C87D55',
            terracottalight: '#FBF0EA',
            mustard: '#CFA052',
            mustardlight: '#FBF4E7',
            slateblue: '#5B7B8D',
            slatebluelight: '#EDF3F7',
            softborder: '#E6E0D6'
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            zen: ['"Zen Maru Gothic"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FBF9F5;
      color: #2D312E;
      font-family: 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tab-active { color: #6E836A; font-weight: 700; }
    .badge-blur { backdrop-filter: blur(8px); }
  </style>
</head>
<body class="pb-24 max-w-md mx-auto min-h-screen relative shadow-2xl bg-linen border-x border-softborder/40">

  <!-- TOP HEADER & WEATHER BANNER -->
  <header class="sticky top-0 z-30 bg-washi/90 backdrop-blur-md border-b border-softborder p-4 transition-all">
    <div class="flex justify-between items-center mb-1">
      <div class="flex items-center space-x-2">
        <span class="text-xs font-zen tracking-widest text-matcha uppercase px-2 py-0.5 rounded-full bg-matchalight border border-matcha/20">2026 濟州 · 首爾</span>
        <h1 class="text-lg font-bold text-charcoal font-zen tracking-wide" id="header-title">濟州自駕遊</h1>
      </div>
      <button onclick="switchTab('info')" class="text-xs text-mutedgray hover:text-charcoal flex items-center gap-1 bg-sand px-2.5 py-1 rounded-full border border-softborder">
        <i class="fa-solid fa-circle-info text-matcha"></i> 資訊
      </button>
    </div>

    <!-- Live Weather Pill Card -->
    <div id="weather-banner" class="bg-gradient-to-r from-matchalight/60 to-sand/80 rounded-2xl p-3 border border-matcha/15 flex justify-between items-center transition-all duration-300">
      <div class="flex items-center space-x-3">
        <div id="weather-icon-container" class="text-2xl text-matcha w-8 text-center">
          <i class="fa-solid fa-sun animate-pulse"></i>
        </div>
        <div>
          <div class="flex items-baseline space-x-1.5">
            <span id="weather-temp" class="text-xl font-bold font-zen text-charcoal">17°C</span>
            <span id="weather-desc" class="text-xs text-mutedgray font-medium">晴朗微風</span>
          </div>
          <p id="weather-location" class="text-[11px] text-mutedgray/90 flex items-center gap-1">
            <i class="fa-solid fa-location-dot text-[10px] text-terracotta"></i> 濟州市 Jeju-si
          </p>
        </div>
      </div>
      <div class="text-right text-[11px] text-mutedgray border-l border-softborder pl-3 space-y-0.5">
        <div>降雨率 <span id="weather-pop" class="font-medium text-charcoal">10%</span></div>
        <div>體感 <span id="weather-feels" class="font-medium text-charcoal">16°C</span></div>
      </div>
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTENT CONTAINER -->
  <main class="p-4 space-y-4">

    <!-- TAB 1: ITINERARY (行程) -->
    <section id="tab-itinerary" class="tab-content space-y-4">
      
      <!-- Day Selector Carousel -->
      <div class="flex space-x-2 overflow-x-auto hide-scrollbar py-1 px-0.5" id="day-pills">
        <!-- JS injected pills -->
      </div>

      <!-- Quick Day Summary Header & Add Button -->
      <div class="flex justify-between items-center px-1 pt-1 border-b border-softborder pb-2">
        <div>
          <h2 id="day-title" class="text-base font-bold font-zen text-charcoal flex items-center gap-2">
            <!-- Day Title JS -->
          </h2>
          <span id="day-sub-location" class="inline-block mt-0.5 text-xs text-matcha font-medium bg-matchalight px-2 py-0.5 rounded-md border border-matcha/20">
            <!-- Location JS -->
          </span>
        </div>
        <button onclick="openAddItineraryModal()" class="text-xs bg-matcha text-white px-3 py-1.5 rounded-full font-medium shadow-sm hover:bg-matcha/90 transition-all flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 新增行程
        </button>
      </div>

      <!-- Schedule Cards Container -->
      <div id="cards-container" class="space-y-4">
        <!-- JS dynamic cards insertion -->
      </div>
    </section>

    <!-- TAB 2: TRIP INFO (旅程資訊) -->
    <section id="tab-info" class="tab-content space-y-5 hidden">
      <!-- Section Header -->
      <div class="flex justify-between items-center border-b border-softborder pb-2">
        <h2 class="text-lg font-bold font-zen text-charcoal flex items-center gap-2">
          <i class="fa-solid fa-compass text-matcha"></i> 旅程隨身資訊
        </h2>
        <span class="text-xs text-mutedgray">點擊可直接編輯內容</span>
      </div>

      <!-- Accordions / Cards -->
      <!-- 1. Flights -->
      <div class="bg-washi border border-softborder rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm text-charcoal flex items-center gap-2">
            <i class="fa-solid fa-plane text-slate-400"></i> 航班資訊 (Flight)
          </h3>
          <button onclick="editSection('flight')" class="text-xs text-matcha hover:underline"><i class="fa-solid fa-pen"></i> 編輯</button>
        </div>
        <div id="disp-flight" class="space-y-3 text-xs text-charcoal">
          <!-- Default Flight details -->
        </div>
      </div>

      <!-- 2. Car Rental -->
      <div class="bg-washi border border-softborder rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm text-charcoal flex items-center gap-2">
            <i class="fa-solid fa-car text-matcha"></i> 租車資訊 (Angel Car)
          </h3>
          <button onclick="editSection('car')" class="text-xs text-matcha hover:underline"><i class="fa-solid fa-pen"></i> 編輯</button>
        </div>
        <div id="disp-car" class="space-y-2 text-xs text-charcoal">
          <!-- Default Car details -->
        </div>
      </div>

      <!-- 3. Accommodations -->
      <div class="bg-washi border border-softborder rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm text-charcoal flex items-center gap-2">
            <i class="fa-solid fa-hotel text-terracotta"></i> 住宿資訊 (Stay)
          </h3>
          <button onclick="editSection('hotel')" class="text-xs text-matcha hover:underline"><i class="fa-solid fa-pen"></i> 編輯</button>
        </div>
        <div id="disp-hotel" class="space-y-3 text-xs text-charcoal">
          <!-- Default Hotel details -->
        </div>
      </div>

      <!-- 4. Emergency Contacts -->
      <div class="bg-washi border border-softborder rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm text-charcoal flex items-center gap-2">
            <i class="fa-solid fa-phone-volume text-red-500"></i> 緊急聯絡電話
          </h3>
          <button onclick="editSection('emergency')" class="text-xs text-matcha hover:underline"><i class="fa-solid fa-pen"></i> 編輯</button>
        </div>
        <div id="disp-emergency" class="space-y-2 text-xs text-charcoal">
          <!-- Default Emergency contacts -->
        </div>
      </div>
    </section>

    <!-- TAB 3: EXPENSE TRACKER (獨立記帳本) -->
    <section id="tab-expense" class="tab-content space-y-4 hidden">
      <div class="flex justify-between items-center border-b border-softborder pb-2">
        <div>
          <h2 class="text-lg font-bold font-zen text-charcoal flex items-center gap-2">
            <i class="fa-solid fa-wallet text-mustard"></i> 旅程記帳本
          </h2>
          <p class="text-xs text-mutedgray">隨時掌控旅程開銷與即時匯率換算</p>
        </div>
        <button onclick="openAddExpenseModal()" class="text-xs bg-matcha text-white px-3.5 py-1.5 rounded-full font-medium shadow-sm hover:bg-matcha/90">
          <i class="fa-solid fa-plus"></i> 新增筆數
        </button>
      </div>

      <!-- Rate Setting Card -->
      <div class="bg-washi border border-softborder rounded-2xl p-3.5 shadow-sm space-y-2">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-charcoal flex items-center gap-1.5">
            <i class="fa-solid fa-calculator text-matcha"></i> 自訂換算匯率 Setting
          </label>
          <span class="text-[10px] text-mutedgray">輸入 1 HKD 等於多少 KRW</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-charcoal">1 HKD =</span>
          <input type="number" id="custom-rate-input" onchange="updateExchangeRate()" onkeyup="updateExchangeRate()" class="flex-1 text-xs bg-linen border border-softborder rounded-xl px-3 py-1.5 font-bold font-zen outline-none focus:border-matcha" placeholder="172">
          <span class="text-xs font-bold text-charcoal">KRW ₩</span>
        </div>
      </div>

      <!-- Total Summary Card -->
      <div class="bg-washi border border-softborder rounded-2xl p-4 shadow-sm space-y-3">
        <div class="grid grid-cols-2 gap-2 bg-sand/60 p-3 rounded-xl border border-softborder text-center">
          <div>
            <div class="text-[10px] text-mutedgray uppercase font-semibold">總支出 (KRW)</div>
            <div class="text-lg font-bold text-charcoal font-zen" id="total-krw">₩ 0</div>
          </div>
          <div class="border-l border-softborder">
            <div class="text-[10px] text-mutedgray uppercase font-semibold">折合 (HKD)</div>
            <div class="text-lg font-bold text-terracotta font-zen" id="total-hkd">HK$ 0</div>
          </div>
        </div>

        <!-- Expense List -->
        <div class="space-y-2 max-h-96 overflow-y-auto hide-scrollbar" id="expense-list">
          <!-- Dynamic expenses -->
        </div>
      </div>
    </section>

    <!-- TAB 4: TO BUY LIST (購物清單) -->
    <section id="tab-buy" class="tab-content space-y-4 hidden">
      <div class="flex justify-between items-center border-b border-softborder pb-2">
        <div>
          <h2 class="text-lg font-bold font-zen text-charcoal flex items-center gap-2">
            <i class="fa-solid fa-bag-shopping text-mustard"></i> 必買與願望清單
          </h2>
          <p class="text-xs text-mutedgray">濟州限定伴手禮、韓牌服飾與美妝</p>
        </div>
        <button onclick="openAddBuyItemModal()" class="text-xs bg-mustard text-white px-3 py-1.5 rounded-full font-medium shadow-sm">
          <i class="fa-solid fa-plus"></i> 新增項目
        </button>
      </div>

      <!-- Quick Add Input Bar -->
      <div class="flex gap-2 bg-washi p-2 rounded-xl border border-softborder">
        <input type="text" id="quick-buy-input" placeholder="輸入要買的物品..." class="flex-1 text-xs bg-transparent px-2 py-1 outline-none">
        <button onclick="quickAddBuyItem()" class="text-xs bg-matcha text-white px-3 py-1 rounded-lg">新增</button>
      </div>

      <!-- Filter / Category Tabs -->
      <div class="flex space-x-2 text-xs">
        <button onclick="filterBuyList('all')" id="buy-filter-all" class="px-3 py-1 rounded-full bg-charcoal text-white font-medium">全部</button>
        <button onclick="filterBuyList('pending')" id="buy-filter-pending" class="px-3 py-1 rounded-full bg-sand text-mutedgray">未購買</button>
        <button onclick="filterBuyList('done')" id="buy-filter-done" class="px-3 py-1 rounded-full bg-sand text-mutedgray">已完成</button>
      </div>

      <!-- List Container -->
      <div id="tobuy-container" class="space-y-2">
        <!-- JS rendered items -->
      </div>
    </section>

  </main>

  <!-- EDIT MODALS CONTAINER -->
  <!-- 1. Text Info Edit Modal -->
  <div id="modal-edit-info" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-washi w-full max-w-sm rounded-2xl p-5 border border-softborder shadow-2xl space-y-4">
      <h3 class="font-bold text-base text-charcoal border-b border-softborder pb-2" id="modal-info-title">編輯資訊</h3>
      <textarea id="modal-info-textarea" rows="6" class="w-full text-xs p-3 rounded-xl border border-softborder bg-linen outline-none focus:border-matcha font-mono"></textarea>
      <div class="flex justify-end gap-2 text-xs">
        <button onclick="closeModal('modal-edit-info')" class="px-4 py-2 rounded-xl bg-sand text-mutedgray font-medium">取消</button>
        <button onclick="saveInfoEdit()" class="px-4 py-2 rounded-xl bg-matcha text-white font-medium">儲存修改</button>
      </div>
    </div>
  </div>

  <!-- 2. Add Expense Modal -->
  <div id="modal-add-expense" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-washi w-full max-w-sm rounded-2xl p-5 border border-softborder shadow-2xl space-y-3">
      <h3 class="font-bold text-base text-charcoal border-b border-softborder pb-2">新增記帳項目</h3>
      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-mutedgray mb-1">項目名稱</label>
          <input type="text" id="exp-name" placeholder="例如: 濟州黑豬肉晚餐" class="w-full p-2.5 rounded-xl border border-softborder bg-linen outline-none">
        </div>
        <div>
          <label class="block text-mutedgray mb-1">金額 (KRW ₩)</label>
          <input type="number" id="exp-amount" placeholder="例如: 45000" class="w-full p-2.5 rounded-xl border border-softborder bg-linen outline-none">
        </div>
        <div>
          <label class="block text-mutedgray mb-1">分類</label>
          <select id="exp-cat" class="w-full p-2.5 rounded-xl border border-softborder bg-linen outline-none">
            <option value="餐飲">🍽️ 餐飲 Dining</option>
            <option value="購物">🛍️ 購物 Shopping</option>
            <option value="景點">🎟️ 門票/景點 Ticket</option>
            <option value="交通">🚗 交通/租車 Transport</option>
            <option value="住宿">🏠 住宿 Stay</option>
            <option value="其他">📦 其他 Other</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 text-xs pt-2">
        <button onclick="closeModal('modal-add-expense')" class="px-4 py-2 rounded-xl bg-sand text-mutedgray font-medium">取消</button>
        <button onclick="saveExpense()" class="px-4 py-2 rounded-xl bg-matcha text-white font-medium">確認新增</button>
      </div>
    </div>
  </div>

  <!-- 3. Add/Edit Itinerary Modal (新增/編輯行程卡片 Modal - 擴充自訂地圖連結) -->
  <div id="modal-edit-itinerary" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-washi w-full max-w-sm rounded-2xl p-5 border border-softborder shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto hide-scrollbar">
      <h3 class="font-bold text-base text-charcoal border-b border-softborder pb-2" id="modal-itin-title">新增/編輯行程</h3>
      <input type="hidden" id="itin-item-index" value="-1">
      <div class="space-y-2.5 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-mutedgray mb-1 font-medium">卡片類型</label>
            <select id="itin-type" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none">
              <option value="景點">景點</option>
              <option value="餐廳">餐廳</option>
              <option value="購物">購物</option>
              <option value="交通">交通</option>
              <option value="住宿">住宿</option>
            </select>
          </div>
          <div>
            <label class="block text-mutedgray mb-1 font-medium">標籤顏色</label>
            <select id="itin-badge-type" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none">
              <option value="green">綠色 (景點)</option>
              <option value="orange">橙色 (餐廳)</option>
              <option value="gold">黃金色 (購物)</option>
              <option value="blue">藍色 (交通)</option>
              <option value="slate">灰色 (住宿)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">時間範圍</label>
          <input type="text" id="itin-time" placeholder="例如: 10:00 - 11:30" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none">
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">地點/項目名稱 (中文)</label>
          <input type="text" id="itin-name" placeholder="例如: 君悅酒店汗蒸幕" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none font-bold">
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">英文/韓文名稱</label>
          <input type="text" id="itin-name-enko" placeholder="例如: 그랜드 하얏트 제주 찜질 스파" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none font-mono">
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">韓文地址 (導航使用)</label>
          <input type="text" id="itin-addr-ko" placeholder="例如: 제주특별자치도 제주시 노연로 12 6층" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none font-mono">
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">英文地址</label>
          <input type="text" id="itin-addr-en" placeholder="例如: 6F, 12 Noyeon-ro, Jeju-si" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none font-mono">
        </div>

        <!-- 自訂地圖連結擴充欄位 -->
        <div class="border-t border-b border-softborder py-2 my-1 space-y-2 bg-sand/30 p-2 rounded-xl">
          <span class="block text-[11px] font-bold text-matcha">🗺️ 地圖導航連結 (可留空選填)：</span>
          <div>
            <label class="block text-mutedgray mb-0.5 font-medium text-[10px]">自訂 Google Map URL</label>
            <input type="url" id="itin-custom-google-url" placeholder="留空將自動由名稱/地址搜尋" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none text-[11px]">
          </div>
          <div>
            <label class="block text-mutedgray mb-0.5 font-medium text-[10px]">自訂 Naver Map URL</label>
            <input type="url" id="itin-custom-naver-url" placeholder="留空將自動由名稱/地址搜尋" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none text-[11px]">
          </div>
        </div>

        <div>
          <label class="block text-mutedgray mb-1 font-medium">營業/開放時間資訊</label>
          <input type="text" id="itin-hours" placeholder="例如: 07:00 - 00:00" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none">
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">重點/亮點提示</label>
          <input type="text" id="itin-highlight" placeholder="例如: 必吃美食: 海螺刀削麵" class="w-full p-2 rounded-xl border border-softborder bg-linen outline-none">
        </div>
        <div>
          <label class="block text-mutedgray mb-1 font-medium">導遊手札 / 詳細攻略</label>

          })
          .catch(err => {
            console.warn('Service Worker 註冊跳過或受限:', err);
          });
      }
    }

    // --- TAB SWITCHING ---
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');

      // Update Nav Buttons
      ['itinerary', 'info', 'expense', 'buy'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) {
          if (t === tab) {
            btn.className = "flex flex-col items-center gap-1 text-xs tab-active transition-all";
          } else {
            btn.className = "flex flex-col items-center gap-1 text-xs text-mutedgray transition-all";
          }
        }
      });

      // Update Header Title based on Tab
      const headerTitle = document.getElementById('header-title');
      if (tab === 'itinerary') headerTitle.innerText = "濟州自駕遊";
      else if (tab === 'info') headerTitle.innerText = "旅程隨身資訊";
      else if (tab === 'expense') headerTitle.innerText = "旅程記帳本";
      else if (tab === 'buy') headerTitle.innerText = "必買與願望清單";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- DAY PILLS & ITINERARY RENDERING ---
    function renderDayPills() {
      const container = document.getElementById('day-pills');
      container.innerHTML = itineraryData.map((d, idx) => `
        <button onclick="changeDay(${idx})" class="flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-medium transition-all ${idx === currentDayIndex ? 'bg-matcha text-white shadow-md font-bold' : 'bg-washi text-mutedgray border border-softborder hover:bg-sand'}">
          D${d.day} <span class="text-[10px] opacity-90">${d.date.split(' ')[0]}</span>
        </button>
      `).join('');
    }

    function changeDay(index) {
      currentDayIndex = index;
      renderDayPills();
      renderDayItinerary(index);
    }

    function renderDayItinerary(index) {
      const data = itineraryData[index];

      // Update Weather Pill
      document.getElementById('weather-temp').innerText = data.weather.temp;
      document.getElementById('weather-desc').innerText = data.weather.desc;
      document.getElementById('weather-pop').innerText = data.weather.pop;
      document.getElementById('weather-feels').innerText = data.weather.feels;
      document.getElementById('weather-location').innerHTML = `<i class="fa-solid fa-location-dot text-[10px] text-terracotta"></i> ${data.location}`;
      document.getElementById('weather-icon-container').innerHTML = `<i class="fa-solid ${data.weather.icon} animate-pulse"></i>`;

      // Update Day Header
      document.getElementById('day-title').innerHTML = `<i class="fa-regular fa-calendar-check text-matcha"></i> ${data.title}`;
      document.getElementById('day-sub-location').innerText = data.location;

      // Render Cards
      const cardsContainer = document.getElementById('cards-container');
      if (!data.items || data.items.length === 0) {
        cardsContainer.innerHTML = `<div class="text-center text-xs text-mutedgray py-12 bg-washi rounded-2xl border border-softborder">本日暫無行程安排，點擊右上角「新增行程」吧！</div>`;
        return;
      }

      cardsContainer.innerHTML = data.items.map((item, itemIdx) => {

        // Badge Styling
        let badgeStyle = "bg-matchalight text-matcha border-matcha/30";
        if (item.badgeType === "orange") badgeStyle = "bg-terracottalight text-terracotta border-terracotta/30";
        else if (item.badgeType === "gold") badgeStyle = "bg-mustardlight text-mustard border-mustard/30";
        else if (item.badgeType === "blue") badgeStyle = "bg-slatebluelight text-slateblue border-slateblue/30";
        else if (item.badgeType === "slate") badgeStyle = "bg-sand text-charcoal border-softborder";

        // Navigation Search Queries / Custom URLs
        const searchNavQuery = encodeURIComponent(`${item.name} ${item.addrKo || ''}`);
        const googleMapUrl = item.customGoogleUrl || `https://www.google.com/maps/search/?api=1&query=${searchNavQuery}`;
        const naverMapUrl = item.customNaverUrl || `https://map.naver.com/v5/search/${searchNavQuery}`;

        return `
          <div class="bg-washi border border-softborder rounded-2xl p-4 shadow-sm hover:shadow-md transition-all space-y-3 relative group">
            
            <!-- Card Header & Management Tools (Edit / Move / Delete) -->
            <div class="flex justify-between items-start gap-2">
              <div class="space-y-1 flex-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${badgeStyle}">${item.type}</span>
                  ${item.time ? `<span class="text-xs text-mutedgray font-medium"><i class="fa-regular fa-clock text-[10px]"></i> ${item.time}</span>` : ''}
                </div>
                <h3 class="text-base font-bold font-zen text-charcoal leading-snug">${item.name}</h3>
                ${item.nameEnKo ? `<p class="text-xs text-mutedgray/90 font-mono">${item.nameEnKo}</p>` : ''}
              </div>

              <!-- Quick Action Buttons: Move Up, Move Down, Edit, Delete -->
              <div class="flex items-center gap-1.5 text-xs bg-linen p-1 rounded-xl border border-softborder shrink-0">
                <button onclick="moveItineraryCard(${itemIdx}, -1)" class="w-6 h-6 flex items-center justify-center text-mutedgray hover:text-charcoal hover:bg-sand rounded-lg transition-colors" title="上移">
                  <i class="fa-solid fa-arrow-up text-[11px]"></i>
                </button>
                <button onclick="moveItineraryCard(${itemIdx}, 1)" class="w-6 h-6 flex items-center justify-center text-mutedgray hover:text-charcoal hover:bg-sand rounded-lg transition-colors" title="下移">
                  <i class="fa-solid fa-arrow-down text-[11px]"></i>
                </button>
                <div class="w-[1px] h-3 bg-softborder"></div>
                <button onclick="openEditItineraryModal(${itemIdx})" class="w-6 h-6 flex items-center justify-center text-matcha hover:bg-matchalight rounded-lg transition-colors" title="編輯">
                  <i class="fa-solid fa-pen text-[11px]"></i>
                </button>
                <button onclick="deleteItineraryCard(${itemIdx})" class="w-6 h-6 flex items-center justify-center text-mutedgray hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="刪除">
                  <i class="fa-regular fa-trash-can text-[11px]"></i>
                </button>
              </div>
            </div>

            <!-- Operating Hours & Highlight Tag -->
            ${item.hours ? `
              <div class="text-[11px] text-mutedgray flex items-center gap-1.5 bg-linen px-2.5 py-1 rounded-lg border border-softborder/60">
                <i class="fa-solid fa-store text-matcha"></i>
                <span>${item.hours}</span>
              </div>
            ` : ''}

            ${item.highlight ? `
              <div class="bg-terracottalight/70 border border-terracotta/20 text-terracotta text-xs p-2.5 rounded-xl font-medium space-y-0.5">
                <div class="flex items-center gap-1 font-bold">
                  <i class="fa-solid fa-star text-[10px]"></i> 導遊手札 / 亮點
                </div>
                <div>${formatHighlight(item.highlight)}</div>
              </div>
            ` : ''}

            <!-- Story / Extra Insights -->
            ${item.guide ? `
              <div class="text-xs text-charcoal/90 bg-sand/40 p-3 rounded-xl border border-softborder/60 leading-relaxed">
                <span class="font-semibold text-matcha font-zen">💡 景點故事與攻略：</span>${item.guide}
              </div>
            ` : ''}

            <!-- Address & Copy Button -->
            ${(item.addrKo || item.addrEn) ? `
              <div class="bg-linen p-2.5 rounded-xl border border-softborder/80 space-y-1 text-[11px]">
                <div class="flex justify-between items-center">
                  <span class="text-mutedgray font-medium">地址 (Address)</span>
                  ${item.addrKo ? `
                    <button onclick="copyToClipboard('${escapeQuotes(item.addrKo)}')" class="text-matcha hover:underline flex items-center gap-1 font-medium">
                      <i class="fa-regular fa-copy"></i> 複製韓文地址
                    </button>
                  ` : ''}
                </div>
                ${item.addrKo ? `<div class="text-charcoal font-mono select-all">${item.addrKo}</div>` : ''}
                ${item.addrEn ? `<div class="text-mutedgray font-mono text-[10px] truncate">${item.addrEn}</div>` : ''}
              </div>
            ` : ''}

            <!-- Navigation Buttons (支援自訂連結與動態連結) -->
            <div class="grid grid-cols-2 gap-2 pt-1">
              <a href="${googleMapUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 bg-linen hover:bg-sand text-charcoal border border-softborder py-2 px-3 rounded-xl text-xs font-medium transition-colors">
                <i class="fa-map-location-dot text-red-500"></i> Google Map
              </a>
              <a href="${naverMapUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 bg-matchalight hover:bg-matchalight/80 text-matcha border border-matcha/30 py-2 px-3 rounded-xl text-xs font-medium transition-colors">
                <i class="fa-solid fa-location-arrow text-matcha"></i> Naver Map 導航
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    // --- ITINERARY CARD CRUD & REORDER LOGIC ---
    function openAddItineraryModal() {
      document.getElementById('modal-itin-title').innerText = `新增 D${itineraryData[currentDayIndex].day} 行程`;
      document.getElementById('itin-item-index').value = "-1";
      document.getElementById('itin-type').value = "景點";
      document.getElementById('itin-badge-type').value = "green";
      document.getElementById('itin-time').value = "";
      document.getElementById('itin-name').value = "";
      document.getElementById('itin-name-enko').value = "";
      document.getElementById('itin-addr-ko').value = "";
      document.getElementById('itin-addr-en').value = "";
      document.getElementById('itin-custom-google-url').value = "";
      document.getElementById('itin-custom-naver-url').value = "";
      document.getElementById('itin-hours').value = "";
      document.getElementById('itin-highlight').value = "";
      document.getElementById('itin-guide').value = "";

      document.getElementById('modal-edit-itinerary').classList.remove('hidden');
    }

    function openEditItineraryModal(itemIdx) {
      const item = itineraryData[currentDayIndex].items[itemIdx];
      document.getElementById('modal-itin-title').innerText = "編輯行程卡片";
      document.getElementById('itin-item-index').value = itemIdx;
      document.getElementById('itin-type').value = item.type || "景點";
      document.getElementById('itin-badge-type').value = item.badgeType || "green";
      document.getElementById('itin-time').value = item.time || "";
      document.getElementById('itin-name').value = item.name || "";
      document.getElementById('itin-name-enko').value = item.nameEnKo || "";
      document.getElementById('itin-addr-ko').value = item.addrKo || "";
      document.getElementById('itin-addr-en').value = item.addrEn || "";
      document.getElementById('itin-custom-google-url').value = item.customGoogleUrl || "";
      document.getElementById('itin-custom-naver-url').value = item.customNaverUrl || "";
      document.getElementById('itin-hours').value = item.hours || "";
      document.getElementById('itin-highlight').value = item.highlight || "";
      document.getElementById('itin-guide').value = item.guide || "";

      document.getElementById('modal-edit-itinerary').classList.remove('hidden');
    }

    function saveItineraryCard() {
      const itemIdx = parseInt(document.getElementById('itin-item-index').value);
      const name = document.getElementById('itin-name').value.trim();

      if (!name) {
        showToast('請至少輸入行程名稱！');
        return;
      }

      const cardData = {
        type: document.getElementById('itin-type').value,
        badgeType: document.getElementById('itin-badge-type').value,
        time: document.getElementById('itin-time').value.trim(),
        name: name,
        nameEnKo: document.getElementById('itin-name-enko').value.trim(),
        addrKo: document.getElementById('itin-addr-ko').value.trim(),
        addrEn: document.getElementById('itin-addr-en').value.trim(),
        customGoogleUrl: document.getElementById('itin-custom-google-url').value.trim(),
        customNaverUrl: document.getElementById('itin-custom-naver-url').value.trim(),
        hours: document.getElementById('itin-hours').value.trim(),
        highlight: document.getElementById('itin-highlight').value.trim(),
        guide: document.getElementById('itin-guide').value.trim()
      };

      if (itemIdx === -1) {
        // Add new card
        itineraryData[currentDayIndex].items.push(cardData);
        showToast('已新增行程！');
      } else {
        // Update existing card
        itineraryData[currentDayIndex].items[itemIdx] = cardData;
        showToast('已更新行程！');
      }

      localStorage.setItem('jeju_itinerary_data', JSON.stringify(itineraryData));
      renderDayItinerary(currentDayIndex);
      closeModal('modal-edit-itinerary');
    }

    function deleteItineraryCard(itemIdx) {
      itineraryData[currentDayIndex].items.splice(itemIdx, 1);
      localStorage.setItem('jeju_itinerary_data', JSON.stringify(itineraryData));
      renderDayItinerary(currentDayIndex);
      showToast('已刪除行程');
    }

    function moveItineraryCard(itemIdx, direction) {
      const items = itineraryData[currentDayIndex].items;
      const targetIdx = itemIdx + direction;

      if (targetIdx < 0 || targetIdx >= items.length) return;

      // Swap items
      const temp = items[itemIdx];
      items[itemIdx] = items[targetIdx];
      items[targetIdx] = temp;

      localStorage.setItem('jeju_itinerary_data', JSON.stringify(itineraryData));
      renderDayItinerary(currentDayIndex);
      showToast('已調整行程順序');
    }

    // --- HIGHLIGHT FORMATTER (Bold tags) ---
    function formatHighlight(text) {
      return text
        .replace(/(必吃美食[:：]?)/g, '<strong class="text-terracotta font-bold">$1</strong>')
        .replace(/(必點菜單[:：]?)/g, '<strong class="text-terracotta font-bold">$1</strong>')
        .replace(/(必買伴手禮[:：]?)/g, '<strong class="text-mustard font-bold">$1</strong>')
        .replace(/(重要預約代號[:：]?)/g, '<strong class="text-matcha font-bold">$1</strong>')
        .replace(/(攻略秘訣[:：]?)/g, '<strong class="text-slateblue font-bold">$1</strong>');
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function copyToClipboard(text) {
      const tempInput = document.createElement('input');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      
      // Toast notice
      showToast('已成功複製韓文地址！');
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 z-50 bg-charcoal text-white text-xs px-4 py-2 rounded-full shadow-lg font-medium animate-bounce';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    // --- TRIP INFO & EDITING ---
    function renderTripInfo() {
      ['flight', 'car', 'hotel', 'emergency'].forEach(key => {
        const el = document.getElementById(`disp-${key}`);
        if (el) {
          el.innerHTML = tripInfoState[key].split('\n').map(line => `<div>${line}</div>`).join('');
        }
      });
    }

    function editSection(key) {
      currentEditKey = key;
      const titles = { flight: "編輯航班資訊", car: "編輯租車資訊", hotel: "編輯住宿資訊", emergency: "編輯緊急聯絡電話" };
      document.getElementById('modal-info-title').innerText = titles[key] || "編輯資訊";
      document.getElementById('modal-info-textarea').value = tripInfoState[key];
      document.getElementById('modal-edit-info').classList.remove('hidden');
    }

    function saveInfoEdit() {
      const val = document.getElementById('modal-info-textarea').value;
      tripInfoState[currentEditKey] = val;
      localStorage.setItem('jeju_trip_info', JSON.stringify(tripInfoState));
      renderTripInfo();
      closeModal('modal-edit-info');
      showToast('資訊已更新！');
    }

    // --- EXPENSE TRACKER & EXCHANGE RATE ---
    function updateExchangeRate() {
      const val = Number(document.getElementById('custom-rate-input').value);
      if (val && val > 0) {
        exchangeRate = val;
        localStorage.setItem('jeju_exchange_rate', exchangeRate);
        renderExpenses();
      }
    }

    function renderExpenses() {
      const listEl = document.getElementById('expense-list');
      let totalKRW = 0;

      listEl.innerHTML = expensesState.map(exp => {
        totalKRW += Number(exp.amount);
        const hkd = (exp.amount / exchangeRate).toFixed(1);
        return `
          <div class="flex justify-between items-center bg-linen p-2.5 rounded-xl border border-softborder text-xs">
            <div class="space-y-0.5">
              <div class="font-bold text-charcoal flex items-center gap-1.5">
                <span class="text-[10px] bg-sand px-1.5 py-0.5 rounded text-mutedgray">${exp.category}</span>
                ${exp.name}
              </div>
              <div class="text-[10px] text-mutedgray">≈ HK$ ${hkd}</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold font-zen text-charcoal">₩ ${Number(exp.amount).toLocaleString()}</span>
              <button onclick="deleteExpense(${exp.id})" class="text-mutedgray hover:text-red-500 text-xs"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('total-krw').innerText = `₩ ${totalKRW.toLocaleString()}`;
      document.getElementById('total-hkd').innerText = `HK$ ${(totalKRW / exchangeRate).toFixed(0)}`;
    }

    function openAddExpenseModal() {
      document.getElementById('exp-name').value = '';
      document.getElementById('exp-amount').value = '';
      document.getElementById('modal-add-expense').classList.remove('hidden');
    }

    function saveExpense() {
      const name = document.getElementById('exp-name').value.trim();
      const amount = document.getElementById('exp-amount').value;
      const category = document.getElementById('exp-cat').value;

      if (!name || !amount) {
        showToast('請填寫完整名稱與金額！');
        return;
      }

      expensesState.push({
        id: Date.now(),
        name,
        amount: Number(amount),
        category
      });

      localStorage.setItem('jeju_expenses', JSON.stringify(expensesState));
      renderExpenses();
      closeModal('modal-add-expense');
      showToast('已新增記帳紀錄！');
    }

    function deleteExpense(id) {
      expensesState = expensesState.filter(e => e.id !== id);
      localStorage.setItem('jeju_expenses', JSON.stringify(expensesState));
      renderExpenses();
      showToast('已刪除紀錄');
    }

    // --- TO BUY LIST LOGIC ---
    function filterBuyList(filter) {
      buyFilter = filter;
      ['all', 'pending', 'done'].forEach(f => {
        const btn = document.getElementById(`buy-filter-${f}`);
        if (f === filter) {
          btn.className = "px-3 py-1 rounded-full bg-charcoal text-white font-medium";
        } else {
          btn.className = "px-3 py-1 rounded-full bg-sand text-mutedgray";
        }
      });
      renderBuyList();
    }

    function renderBuyList() {
      const container = document.getElementById('tobuy-container');
      let filtered = toBuyState;

      if (buyFilter === 'pending') filtered = toBuyState.filter(i => !i.done);
      else if (buyFilter === 'done') filtered = toBuyState.filter(i => i.done);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-mutedgray py-8">尚無項目</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="flex justify-between items-center bg-washi p-3 rounded-2xl border border-softborder text-xs transition-all ${item.done ? 'opacity-50 line-through bg-sand/30' : ''}">
          <div class="flex items-center gap-3">
            <button onclick="toggleBuyItem(${item.id})" class="text-base text-matcha">
              <i class="${item.done ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle'}"></i>
            </button>
            <div>
              <div class="font-medium text-charcoal">${item.text}</div>
              ${item.category ? `<span class="text-[10px] text-mutedgray bg-linen px-1.5 py-0.5 rounded border border-softborder/60">${item.category}</span>` : ''}
            </div>
          </div>
          <button onclick="deleteBuyItem(${item.id})" class="text-mutedgray hover:text-red-500 text-xs px-2">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    function toggleBuyItem(id) {
      toBuyState = toBuyState.map(i => i.id === id ? { ...i, done: !i.done } : i);
      localStorage.setItem('jeju_tobuy', JSON.stringify(toBuyState));
      renderBuyList();
    }

    function quickAddBuyItem() {
      const input = document.getElementById('quick-buy-input');
      const val = input.value.trim();
      if (!val) return;

      toBuyState.push({
        id: Date.now(),
        text: val,
        category: "一般",
        done: false
      });

      localStorage.setItem('jeju_tobuy', JSON.stringify(toBuyState));
      input.value = '';
      renderBuyList();
      showToast('已新增至購物清單！');
    }

    function openAddBuyItemModal() {
      quickAddBuyItem();
    }

    function deleteBuyItem(id) {
      toBuyState = toBuyState.filter(i => i.id !== id);
      localStorage.setItem('jeju_tobuy', JSON.stringify(toBuyState));
      renderBuyList();
      showToast('已刪除項目');
    }

    // --- MODAL UTILS ---
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }
  </script>
</body>
</html>
